# Helios: project must be located in ~/lab2.
# HTTP port: 24000; Java FastCGI port: 24001.
ServerRoot "/usr/local"
Define LAB_ROOT "${HOME}/lab2"
Listen 24000
ServerName localhost:24000

LoadModule authz_core_module libexec/apache24/mod_authz_core.so
LoadModule authz_host_module libexec/apache24/mod_authz_host.so
LoadModule mime_module libexec/apache24/mod_mime.so
LoadModule dir_module libexec/apache24/mod_dir.so
LoadModule log_config_module libexec/apache24/mod_log_config.so
LoadModule alias_module libexec/apache24/mod_alias.so
LoadModule fastcgi_module libexec/apache24/mod_fastcgi.so

# Apache is started by the student and keeps that user's permissions.
PidFile "${LAB_ROOT}/httpd-root/httpd.pid"
Mutex default:${LAB_ROOT}/httpd-root/mutex-dir/
ErrorLog "${LAB_ROOT}/httpd-root/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "${LAB_ROOT}/httpd-root/access.log" common
TypesConfig etc/apache24/mime.types
DirectoryIndex index.html
AcceptFilter http none

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "${LAB_ROOT}/static"
<Directory "${LAB_ROOT}/static">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# -nph matches the full HTTP status line produced by Main.java.
FastCgiExternalServer "${LAB_ROOT}/httpd-root/fcgi-bin/app.jar" -host localhost:24001 -nph
Alias /fcgi-bin/ "${LAB_ROOT}/httpd-root/fcgi-bin/"
<Directory "${LAB_ROOT}/httpd-root/fcgi-bin">
    Options +ExecCGI -Indexes
    AllowOverride None
    SetHandler fastcgi-script
    Require all granted
</Directory>
